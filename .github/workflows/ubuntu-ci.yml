name: Ubuntu CI

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Ubuntu foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Resolve locked packages
        working-directory: app
        run: flutter pub get

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- app/pubspec.lock

      - name: Check formatting
        run: make format-check

      - name: Check dependencies and licences
        run: make dependencies

      - name: Check current vulnerability advisories
        run: make vulnerabilities

      - name: Check schema and content baseline
        run: make inputs

      - name: Analyze Flutter application
        run: make analyze

      - name: Run unit, widget, and accessibility smoke tests
        run: make test

      - name: Build Ubuntu release bundle
        run: make build-linux
